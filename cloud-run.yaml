apiVersion: serving.knative.dev/v1
kind: Service

metadata:
  name: qeysar-downloader

spec:
  template:

    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"

    spec:
      containerConcurrency: 20
      timeoutSeconds: 900

      containers:
        - image: IMAGE_PLACEHOLDER

          ports:
            - name: http1
              containerPort: 8080

          env:
            - name: PORT
              value: "8080"

            - name: ENVIRONMENT
              value: "production"

          resources:
            limits:
              cpu: "1"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
